server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # gzip covers the compressible types; Brotli/Zstd is enabled at the
    # Dokploy/Traefik edge (compress middleware), where TLS and HTTP/2
    # terminate, so it applies to both this app and /docs uniformly.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        application/xml
        image/svg+xml;

    # Vite emits every build artifact content-hashed under /assets/ — safe to
    # cache for a year; a new build produces new filenames.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html and root files (favicon, manifest, sitemap, og image) always
    # revalidate so deploys are picked up immediately.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
