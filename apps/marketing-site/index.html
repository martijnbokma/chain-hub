<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Chain Hub keeps one source of truth for your skills, agents, workflows, rules and prompts, linked into Cursor, Claude Code, Windsurf, Zed, Google Antigravity and Devin — instead of duplicated by hand."

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#1C1D1F" />
    <script>
      (function () {
        var stored = null;
        try {
          stored = localStorage.getItem('chain-hub-theme');
        } catch (e) {}
        var theme =
          stored === 'light' || stored === 'dark'
            ? stored
            : window.matchMedia('(prefers-color-scheme: light)').matches
              ? 'light'
              : 'dark';
        document.documentElement.classList.toggle('dark', theme === 'dark');
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', theme === 'dark' ? '#1C1D1F' : '#F2F0EB');
      })();
    </script>
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Chain Hub — One hub. Every editor." />
    <meta
      property="og:description"
      content="Chain Hub keeps one source of truth for your skills, agents, workflows, rules and prompts, linked into Cursor, Claude Code, Windsurf, Zed, Google Antigravity and Devin — instead of duplicated by hand."
    />
    <meta property="og:image" content="/og.png" />
    <meta name="twitter:card" content="summary_large_image" />

  </head>
