server {
    listen 80;
    server_name _;

    # See apps/marketing-site/nginx.conf — same strategy, docs is served under
    # the /docs prefix. Brotli/Zstd lives at the Dokploy/Traefik edge.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        application/xml
        image/svg+xml;

    location = /docs {
        return 301 /docs/;
    }

    # Content-hashed Vite artifacts — immutable, a year.
    location /docs/assets/ {
        alias /usr/share/nginx/html/docs/assets/;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /docs/ {
        alias /usr/share/nginx/html/docs/;
        try_files $uri $uri/ /docs/index.html;
        add_header Cache-Control "no-cache";
    }
}
