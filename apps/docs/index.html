<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Documentation for Chain Hub — the local-first AI workspace control plane. Hub folder structure, CLI reference, editor setup, learnings and sync."
    />
    <link rel="canonical" href="https://www.chainhub.one/docs/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Chain Hub" />
    <meta property="og:url" content="https://www.chainhub.one/docs/" />
    <meta property="og:title" content="Chain Hub docs" />
    <meta
      property="og:description"
      content="Documentation for Chain Hub — the local-first AI workspace control plane."
    />
    <meta property="og:image" content="https://www.chainhub.one/og.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#1C1D1F" />
    <script>
      (function () {
        var stored = null;
        try {
          stored = localStorage.getItem('chain-hub-theme');
        } catch (e) {}
        var theme =
          stored === 'light' || stored === 'dark'
            ? stored
            : window.matchMedia('(prefers-color-scheme: light)').matches
              ? 'light'
              : 'dark';
        document.documentElement.classList.toggle('dark', theme === 'dark');
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', theme === 'dark' ? '#1C1D1F' : '#F2F0EB');
      })();
    </script>
    <title>Docs — Chain Hub</title>
    <script type="text/javascript">
      (function () {
        try {
          if (
            window.location &&
            window.location.search &&
            window.location.search.indexOf('capture-sitebehaviour-heatmap') !== -1
          ) {
            sessionStorage.setItem('capture-sitebehaviour-heatmap', '_');
          }

          var sbSiteSecret = '12324adf-d0ae-4a97-9fd1-2539868a1917';
          window.sitebehaviourTrackingSecret = sbSiteSecret;
          var scriptElement = document.createElement('script');
          scriptElement.defer = true;
          scriptElement.id = 'site-behaviour-script-v2';
          scriptElement.src =
            'https://sitebehaviour-cdn.fra1.cdn.digitaloceanspaces.com/index.min.js?sitebehaviour-secret=' +
            sbSiteSecret;
          document.head.appendChild(scriptElement);
        } catch (e) {
          console.error(e);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
