name: check
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    name: Build · Lint · Typecheck · Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bunx turbo run build test typecheck
